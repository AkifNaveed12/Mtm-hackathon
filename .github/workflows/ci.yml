name: CI Testing & Quality Gate

on:
  push:
    branches: [main, UI-testing]
  pull_request:
    branches: [main, UI-testing]

jobs:
  backend-qa:
    name: Backend & Agent Invariant QA
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Backend & Planning Unit Tests
        env:
          GROQ_API_KEY: ""
          ENVIRONMENT: test
        run: |
          python -m pytest tests/ -v

      - name: Run Single-Command CLI Runner Verification
        run: |
          python run.py sample_pack.txt

  frontend-qa:
    name: Frontend TypeScript & Next.js Build QA
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package.json

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci || npm install

      - name: Run Next.js Production Build
        working-directory: ./frontend
        run: npm run build
